[package]
name = "drrocket"
version = "1.0.0-beta.4"
edition = "2024"
description = "Dr. Rocket: a fast, beautiful IDE for Racket"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "persistence", "clipboard", "links", "system_fonts", "x11", "wayland"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
alacritty_terminal = "0.26"
ropey = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.17"
arboard = { version = "3", default-features = false }
notify = "8"
ignore = "0.4"
nucleo-matcher = "0.3"
crossbeam-channel = "0.5"
parking_lot = "0.12"
base64 = "0.22"
anyhow = "1"
open = "5"
regex = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

raw-window-handle = "0.6"
trash = "5"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSURL", "NSString", "NSNotification", "NSObject"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSToolbar", "NSView", "NSResponder", "NSGraphics", "NSApplication", "NSRunningApplication", "NSButton", "NSControl", "NSMenu", "NSMenuItem", "NSEvent"] }
winit = { version = "0.30", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1
# Line tables are enough for backtraces, and keep target/debug a fraction of the size.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
resvg = "0.45"

# tools/dev.sh: release-speed code with fast incremental rebuilds (no LTO, no debug checks).
[profile.devfast]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
strip = false
debug = "line-tables-only"
