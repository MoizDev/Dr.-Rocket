[package]
name = "racketeer"
version = "0.1.0"
edition = "2024"
description = "A fast, beautiful IDE for Racket"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
alacritty_terminal = "0.26"
ropey = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.17"
notify = "8"
ignore = "0.4"
nucleo-matcher = "0.3"
crossbeam-channel = "0.5"
parking_lot = "0.12"
base64 = "0.22"
anyhow = "1"
open = "5"
regex = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSToolbar", "NSView", "NSResponder", "NSGraphics"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
