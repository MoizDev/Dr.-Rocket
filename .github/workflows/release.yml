# Build the Windows and Linux downloads and attach them to a GitHub release (the macOS DMG is built
# locally with tools/bundle.sh --universal --dmg and uploaded alongside). Manual only.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0-beta.1 (the release must already exist)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          DRROCKET_UPDATE_PUBLIC_KEY: ${{ vars.DRROCKET_UPDATE_PUBLIC_KEY }}
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $dir = "Dr. Rocket"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target/release/drrocket.exe "$dir/Dr. Rocket.exe"
          Copy-Item BETA.md "$dir/README.md"
          $zip = "Dr. Rocket-$version-windows-x64.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "${{ env.ZIP }}" --clobber

  linux:
    # Built on the oldest supported Ubuntu so the binary runs on older glibc versions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Build
        env:
          DRROCKET_UPDATE_PUBLIC_KEY: ${{ vars.DRROCKET_UPDATE_PUBLIC_KEY }}
        run: cargo build --release
      - name: Package
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          dir="Dr. Rocket"
          mkdir -p "$dir"
          cp target/release/drrocket "$dir/drrocket"
          cp BETA.md "$dir/README.md"
          cp assets/icon/icon_256.png "$dir/drrocket.png"
          cat > "$dir/drrocket.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=Dr. Rocket
          Comment=A fast, modern Racket IDE
          Exec=drrocket %F
          Icon=drrocket
          Categories=Development;IDE;
          MimeType=text/x-racket;
          DESKTOP
          tarball="Dr.Rocket-$version-linux-x64.tar.gz"
          tar -czf "$tarball" "$dir"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "${{ env.TARBALL }}" --clobber
