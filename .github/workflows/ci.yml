# Build, lint and test on macOS, Windows and Linux (with Racket installed, so the backend
# integration tests run). Reused as the release gate at the exact packaged commit.
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, main, optimizations]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Signing and download provenance regressions (offline fixtures)
        run: node --test tools/sign-updates.test.mjs website/lib/download-provenance.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: "9.3"
          variant: CS
          distribution: full
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev xvfb
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --locked
      - name: Test (Linux, virtual display for Racket's GUI library)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --locked
      - name: Release build
        run: cargo build --locked --release
