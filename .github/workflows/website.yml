# Lint, type-check, unit-test, and build the website.
name: Website

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths: ["website/**", "tools/sign-updates*", ".github/workflows/website.yml"]
  pull_request:
    paths:
      - "website/**"
      - "src/editor/keywords.rs"
      - "tests/indent/**"
      - ".github/workflows/website.yml"

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:node
      - name: Signing and provenance regressions (offline fixtures)
        run: node --test ../tools/sign-updates.test.mjs lib/download-provenance.test.mjs
      # A production site build requires actual authenticated archives and release signatures.
      - run: sh scripts/fetch-downloads.sh
      - run: npx next build
