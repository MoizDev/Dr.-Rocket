# Real macOS/Linux/Windows installs with ephemeral Ed25519 keys and localhost TLS. Builds are
# scratch-only debug executables; build.rs forbids their trust configuration in release builds.
name: Update test

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: '9.3'
          variant: CS
          distribution: full
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers libxkbcommon-x11-0 xvfb openssl
      - name: Signed HTTPS staging and native install/relaunch (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 tools/update-e2e.py
      - name: Signed HTTPS staging and native install/relaunch (Windows)
        if: runner.os == 'Windows'
        run: python tools/update-e2e.py
      - name: Signed HTTPS staging and native app-bundle install/relaunch (macOS)
        if: runner.os == 'macOS'
        run: python3 tools/update-e2e.py
