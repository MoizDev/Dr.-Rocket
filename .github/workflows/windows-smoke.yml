# Launch Dr. Rocket on Windows the way a user does (Racket installed, the released zip) and
# report whether it stays up: exit code, crash reports and Windows' own crash log. Manual only.
name: Windows smoke test

on:
  workflow_dispatch:
    inputs:
      source:
        description: "release (the zip on the release tag below) or build (this commit)"
        default: release
      tag:
        description: "Release tag, when source is release"
        default: v1.0.0-beta.1
      simulate_gpu_crash:
        description: "Pretend the previous launch died before painting (tests the software fallback)"
        default: "false"

jobs:
  launch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket
        run: choco install racket -y --no-progress
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.source == 'build'
      - uses: Swatinem/rust-cache@v2
        if: inputs.source == 'build'
      - name: Build
        if: inputs.source == 'build'
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force "Dr. Rocket" | Out-Null
          Copy-Item target/release/drrocket.exe "Dr. Rocket/Dr. Rocket.exe"
      - name: Download the release
        if: inputs.source == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download "${{ inputs.tag }}" -p "*windows-x64.zip" -O app.zip
          Expand-Archive app.zip -DestinationPath .
      - name: Launch
        shell: pwsh
        run: |
          $env:DRROCKET_FRAME_STATS = "1"
          if ("${{ inputs.simulate_gpu_crash }}" -eq "true") {
            # As if the previous launch died in the GPU driver before painting.
            New-Item -ItemType Directory -Force "$env:APPDATA\dr-rocket" | Out-Null
            New-Item -ItemType File -Force "$env:APPDATA\dr-rocket\starting" | Out-Null
          }
          $env:Path = "C:\Program Files\Racket;" + $env:Path
          $env:RUST_BACKTRACE = "1"
          $p = Start-Process "Dr. Rocket/Dr. Rocket.exe" -PassThru -RedirectStandardError err.txt -RedirectStandardOutput out.txt
          Start-Sleep -Seconds 40
          if ($p.HasExited) { "EXITED with code $($p.ExitCode) (0x{0:X8})" -f $p.ExitCode } else { "STILL RUNNING after 40 s"; Stop-Process $p -Force }
          "--- stderr"; Get-Content err.txt -ErrorAction SilentlyContinue
          "--- stdout"; Get-Content out.txt -ErrorAction SilentlyContinue
          "--- crash reports"
          "--- renderer"
          if (Test-Path "$env:APPDATA\dr-rocket\renderer") { "fallback: " + (Get-Content "$env:APPDATA\dr-rocket\renderer" -First 1) } else { "default" }
          if (Test-Path "$env:APPDATA\dr-rocket\starting") { "launch never finished painting" } else { "launch painted" }
          Get-ChildItem "$env:APPDATA\dr-rocket\crash-reports" -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName }
          "--- Windows Application log"
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in 'Application Error', 'Windows Error Reporting' } |
            ForEach-Object { $_.Message }
      - name: Settings screenshots
        if: inputs.source == 'build'
        shell: pwsh
        run: |
          $env:DRROCKET_CONFIG_DIR = (New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/cfg-shot").FullName
          $env:DRROCKET_AUTOMATION = "tools/bench/settings-shot.json"
          Start-Process "Dr. Rocket/Dr. Rocket.exe" -Wait
          Get-ChildItem shots
      - uses: actions/upload-artifact@v4
        if: inputs.source == 'build'
        with:
          name: screenshots
          path: shots/
